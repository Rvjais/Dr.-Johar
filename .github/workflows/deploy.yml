name: Deploy Versions Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Versions Portal & Routing
        run: |
          python publish_version.py --refresh
